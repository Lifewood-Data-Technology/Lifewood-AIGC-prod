packages:
  - "services/*"

allowBuilds:
  esbuild: true
  sharp: true

# drizzle-kit still brings an obsolete esbuild dev server through its loader.
# Keep that loader's transform API while removing the vulnerable server version.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  sharp: 0.35.4
  js-yaml: 4.3.2

  # Keep both dependency majors on their security-patched releases.
  'fast-uri@>=3.0.0 <3.1.7': 3.1.7
  'fast-uri@>=4.0.0 <4.1.4': 4.1.4
